<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-label="Out of 100 wrong AI changes: tests plus a cheating scan stop 8 on small projects and none on real libraries; Apex verify stops 52 on the public projects, 65 on all 17 small projects and 80 on 23 real libraries">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .t { font-size: 17px; font-weight: 600; }
    .l { font-size: 14px; }
    .v { font-size: 16px; font-weight: 700; }
    .f { font-size: 13px; }
  </style>
  <text class="t" x="20" y="30">Out of 100 wrong AI changes, how many get stopped before you merge?</text>
  <text class="l" x="20" y="73">Tests + a cheating scan (17 small projects)</text>
  <rect x="330" y="56" width="400" height="22" rx="4" fill="#8b949e" fill-opacity="0.18"/>
  <rect x="330" y="56" width="33.6" height="22" rx="4" fill="#8b949e"/>
  <text class="v" x="371.6" y="73" style="fill:#8b949e">8</text>
  <text class="l" x="20" y="119">Apex verify (12 public projects, rerunnable)</text>
  <rect x="330" y="102" width="400" height="22" rx="4" fill="#2da44e" fill-opacity="0.18"/>
  <rect x="330" y="102" width="218.4" height="22" rx="4" fill="#2da44e"/>
  <text class="v" x="556.4" y="119" style="fill:#2da44e">52</text>
  <text class="l" x="20" y="165">Apex verify (17 small projects)</text>
  <rect x="330" y="148" width="400" height="22" rx="4" fill="#2da44e" fill-opacity="0.18"/>
  <rect x="330" y="148" width="273.0" height="22" rx="4" fill="#2da44e"/>
  <text class="v" x="611.0" y="165" style="fill:#2da44e">65</text>
  <text class="l" x="20" y="211">Tests + a cheating scan (23 real libraries)</text>
  <rect x="330" y="194" width="400" height="22" rx="4" fill="#8b949e" fill-opacity="0.18"/>
  <text class="v" x="338.0" y="211" style="fill:#8b949e">0</text>
  <text class="l" x="20" y="257">Apex verify (23 real libraries)</text>
  <rect x="330" y="240" width="400" height="22" rx="4" fill="#2da44e" fill-opacity="0.18"/>
  <rect x="330" y="240" width="336.0" height="22" rx="4" fill="#2da44e"/>
  <text class="v" x="674.0" y="257" style="fill:#2da44e">80</text>
  <text class="f" x="20" y="300">Wrongly stopped good changes: about 3 in 100 on the small projects; on real libraries 11 in 100 by the hidden-test label,</text>
  <text class="f" x="20" y="320">about 4 in 100 after a hand audit. It still misses a fair share of the bad ones (about a third on the small projects).</text>
</svg>
