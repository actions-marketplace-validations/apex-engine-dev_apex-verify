<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-label="Out of 100 wrong AI changes: on 17 small projects tests plus a cheating scan stop 8 and Apex verify 65; on 23 real libraries the tests stop 75 and Apex verify 91">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .t { font-size: 17px; font-weight: 600; }
    .l { font-size: 14px; }
    .v { font-size: 16px; font-weight: 700; }
    .f { font-size: 13px; }
  </style>
  <text class="t" x="20" y="30">Out of 100 wrong AI changes, how many get stopped before you merge?</text>
  <text class="l" x="20" y="73">Tests + a cheating scan (17 small projects)</text>
  <rect x="330" y="56" width="370" height="22" rx="4" fill="#8b949e" fill-opacity="0.18"/>
  <rect x="330" y="56" width="29.6" height="22" rx="4" fill="#8b949e"/>
  <text class="v" x="367.6" y="73" style="fill:#8b949e">8</text>
  <text class="l" x="20" y="119">Apex verify (12 public projects, rerunnable)</text>
  <rect x="330" y="102" width="370" height="22" rx="4" fill="#2da44e" fill-opacity="0.18"/>
  <rect x="330" y="102" width="192.4" height="22" rx="4" fill="#2da44e"/>
  <text class="v" x="530.4" y="119" style="fill:#2da44e">52</text>
  <text class="l" x="20" y="165">Apex verify (17 small projects)</text>
  <rect x="330" y="148" width="370" height="22" rx="4" fill="#2da44e" fill-opacity="0.18"/>
  <rect x="330" y="148" width="240.5" height="22" rx="4" fill="#2da44e"/>
  <text class="v" x="578.5" y="165" style="fill:#2da44e">65</text>
  <text class="l" x="20" y="211">Tests + a cheating scan (23 real libraries)</text>
  <rect x="330" y="194" width="370" height="22" rx="4" fill="#8b949e" fill-opacity="0.18"/>
  <rect x="330" y="194" width="277.5" height="22" rx="4" fill="#8b949e"/>
  <text class="v" x="615.5" y="211" style="fill:#8b949e">75</text>
  <text class="l" x="20" y="257">Apex verify (23 real libraries)</text>
  <rect x="330" y="240" width="370" height="22" rx="4" fill="#2da44e" fill-opacity="0.18"/>
  <rect x="330" y="240" width="336.7" height="22" rx="4" fill="#2da44e"/>
  <text class="v" x="674.7" y="257" style="fill:#2da44e">91</text>
  <text class="f" x="20" y="300">Good changes wrongly stopped: about 3 in 100 on the small projects; on the real libraries 23 in 100</text>
  <text class="f" x="20" y="320">(11 of those by the projects' own tests). One run each; Gemini wrote every change.</text>
</svg>
