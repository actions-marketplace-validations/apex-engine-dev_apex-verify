<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-label="Out of 100 wrong AI changes: tests plus a cheating scan stop 8, Apex verify stops 52 on the public projects and 65 across all 17 projects">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .t { font-size: 17px; font-weight: 600; fill: #8b949e; }
    .l { font-size: 14px; }
    .v { font-size: 16px; font-weight: 700; }
  </style>
  <text class="t" x="20" y="30">Out of 100 wrong AI changes, how many get stopped before you merge?</text>
  <text class="l" x="20" y="72">Your tests + a cheating scan</text>
  <rect x="260" y="56" width="420" height="22" rx="4" fill="#8b949e" fill-opacity="0.18"/>
  <rect x="260" y="56" width="33.6" height="22" rx="4" fill="#8b949e"/>
  <text class="v" x="302" y="73" style="fill:#8b949e">8</text>
  <text class="l" x="20" y="122">Apex verify (the 12 public projects)</text>
  <rect x="260" y="106" width="420" height="22" rx="4" fill="#2da44e" fill-opacity="0.18"/>
  <rect x="260" y="106" width="218.4" height="22" rx="4" fill="#2da44e"/>
  <text class="v" x="486" y="123" style="fill:#2da44e">52</text>
  <text class="l" x="20" y="172">Apex verify (all 17 projects)</text>
  <rect x="260" y="156" width="420" height="22" rx="4" fill="#2da44e" fill-opacity="0.18"/>
  <rect x="260" y="156" width="273" height="22" rx="4" fill="#2da44e"/>
  <text class="v" x="541" y="173" style="fill:#2da44e">65</text>
  <text class="l" x="20" y="222">It wrongly stops about 3 of every 100 good changes. It still misses about a third of the bad ones.</text>
</svg>
