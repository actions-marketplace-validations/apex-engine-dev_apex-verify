name: Partnership, hosting or trademark question
description: Using the Apex verify name, using it in a product, or working with the maintainers
labels: [licensing]
body:
  - type: markdown
    attributes:
      value: |
        The code is Apache-2.0: you do not need to ask to use, modify or host it. The Apex verify name and logo are trademarks (see TRADEMARKS.md). Ask here if you want to use them, to partner. Do not include confidential details; we will move to a private channel.
  - type: textarea
    attributes: { label: What do you want to do, description: Product or service, who the users are, expected scale }
    validations: { required: true }
