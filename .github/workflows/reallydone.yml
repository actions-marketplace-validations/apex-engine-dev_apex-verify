# ReallyDone verifies ReallyDone's own pull requests. Without the GEMINI_API_KEY secret it runs the tests and the cheating scan only.
name: ReallyDone verify
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          fail-on: never
