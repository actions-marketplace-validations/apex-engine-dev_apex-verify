# Attaches the installable file to every release, so
#   npx --yes https://github.com/apex-engine-dev/apex-verify/releases/latest/download/apex-verify.tgz verify "<task>"
# always works (a about 60 KB file, no build on the user's machine, no npm account needed).
name: Release asset
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Pack and attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npm pack
          cp apex-verify-*.tgz apex-verify.tgz
          gh release upload "$TAG" apex-verify-*.tgz apex-verify.tgz --clobber
